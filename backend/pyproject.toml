[project]
name = "telecom-agent-backend"
version = "0.1.0"
description = "Backend for AI Telecom Assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]>=0.115.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
